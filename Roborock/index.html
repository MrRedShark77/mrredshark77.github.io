<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roborock Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      padding: 32px;
    }
    .gallery {
      max-width: 1100px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    }
    .card img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #1f2937;
    }
    .card p {
      margin: 0;
      padding: 12px 16px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="gallery">
    <h1>Roborock Gallery</h1>
    <div class="grid">
      <div class="card"><img src="photo1.svg" alt="Roborock photo 1" /><p>Photo 1</p></div>
      <div class="card"><img src="photo2.svg" alt="Roborock photo 2" /><p>Photo 2</p></div>
      <div class="card"><img src="photo3.svg" alt="Roborock photo 3" /><p>Photo 3</p></div>
      <div class="card"><img src="photo4.svg" alt="Roborock photo 4" /><p>Photo 4</p></div>
      <div class="card"><img src="photo5.svg" alt="Roborock photo 5" /><p>Photo 5</p></div>
    </div>
  </div>
</body>
</html>
